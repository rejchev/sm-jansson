name: Release published

on:
  release:
    types: [published]
  
jobs:
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    if: github.event.release.target_commitish == 'main'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        sourcemod-version:
          - 1.12-dev
        include:
          - os: ubuntu-latest
            target-archs: x86
            compiler_cc: clang
            compiler_cxx: clang++

          - os: windows-latest
            target-archs: x86
            compiler_cc: msvc

    steps:
      - name: Install ${{ matrix.os }} packages
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev ${{ matrix.compiler_cc }}

      - name: Select compiler
        if: runner.os == 'Linux'
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
            python-version: 3.11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: extension
          submodules: recursive

      - name: Checkout SourceMod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sourcemod-version }}
          path: sourcemod
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        run: python -m pip install ./ambuild --no-build-isolation

      - name: Build extension
        working-directory: extension
        shell: bash
        run: |
          echo ${{ github.run_number }}
          mkdir build && cd build
          python ../configure.py --enable-optimize --targets=${{ matrix.target-archs }}
          ambuild

      - name: Package extension
        working-directory: extension/build/package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          7z a jansson-${version}.${{ github.run_number }}-${{ matrix.os }}.zip ./*

      - name: Attach extension
        uses: svenstaro/upload-release-action@v2
        with:
            path: extension/build/package
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            file: '*.zip'
            tag: ${{ github.ref }}
            file_glob: true